<!doctype html>
<!-- Seeded copy of the YouTube home grid. Custom element tags match YouTube's, with no behavior. -->
<html lang="en">
<head><meta charset="utf-8"><title>YouTube</title>
<style>ytd-rich-item-renderer,yt-lockup-view-model{display:block}yt-lockup-view-model{width:320px;height:200px;margin:12px;background:#eee}</style>
</head>
<body>
<ytd-page-manager>
  <ytd-rich-grid-renderer>
    <ytd-rich-item-renderer><yt-lockup-view-model data-fixture="yt-spoiler">
      <h3><a href="/watch?v=aaa">Severance Season 2 Finale Ending Explained</a></h3>
    </yt-lockup-view-model></ytd-rich-item-renderer>
    <ytd-rich-item-renderer><yt-lockup-view-model data-fixture="yt-safe-mention">
      <h3><a href="/watch?v=bbb">Severance cast interview at Comic-Con</a></h3>
    </yt-lockup-view-model></ytd-rich-item-renderer>
    <ytd-rich-item-renderer><yt-lockup-view-model data-fixture="yt-unrelated">
      <h3><a href="/watch?v=ccc">10 minute morning workout</a></h3>
    </yt-lockup-view-model></ytd-rich-item-renderer>
  </ytd-rich-grid-renderer>
</ytd-page-manager>
</body>
</html>
